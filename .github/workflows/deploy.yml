# Publication sur les deux environnements, à chaque push sur main :
#   - lab.agence-absolu.com  — la démo, servie dans un sous-dossier (base /<slug>/) ;
#   - bta.agence-absolu.com  — la production, servie à la racine d'un domaine
#     dédié (base /), dont le NDD pointe sur le dossier dist/ du site.
#
# Deux jobs plutôt qu'un : les deux sites ne sont pas forcément hébergés sur la
# même machine, chacun a donc son hôte, son compte et son mot de passe. Un seul
# jeu de secrets ferait silencieusement atterrir la prod sur le serveur du lab —
# rsync réussit, mais à côté.
#
# Deux builds aussi : la base est figée à la compilation dans tous les chemins
# absolus (/assets/…, /busted.png), un même dist/ ne peut pas servir un
# sous-dossier et une racine de domaine.
#
# Transport rsync sur SSH, par mot de passe. Les deux autres voies sont fermées
# chez Infomaniak : l'authentification par clé n'est pas disponible sur un site
# Node.js, et le port FTP est filtré (vérifié : connexion sur 21 en timeout).
#
# Secrets à créer (Settings › Secrets and variables › Actions) :
#   LAB_SSH_HOST / LAB_SSH_USER / LAB_SSH_PASSWORD   serveur du lab
#   BTA_SSH_HOST / BTA_SSH_USER / BTA_SSH_PASSWORD   serveur de production
#   *_SSH_KNOWN_HOSTS  facultatif — sortie de `ssh-keyscan <hôte>`, pour
#                      épingler l'empreinte du serveur plutôt que de la croire
#                      sur parole au premier contact.

name: Déploiement lab + prod

on:
  push:
    branches: [main]
  workflow_dispatch: # publication manuelle depuis l'onglet Actions

concurrency:
  group: deploy-lab-prod
  cancel-in-progress: true # un push plus récent rend le précédent caduc

jobs:
  # ---------------------------------------------------------------- lab ----
  lab:
    name: Démo (lab.agence-absolu.com)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Nom du projet
        id: meta
        run: echo "slug=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"

      - run: npm ci

      # Le dépôt embarque ~19 Mo de médias (posters, vidéos d'en-tête, WebP des
      # projets) : ils partent tels quels dans dist/ via public/.
      #
      # Le build écrit aussi une copie de index.html sous /menu/ et sous chaque
      # slug de projet (voir vite.config.js). C'est ce qui permet de recharger
      # /mon-projet sans réécriture côté serveur, que l'hébergement ne propose
      # pas ici.
      - run: BASE_PATH="/${{ steps.meta.outputs.slug }}/" npm run build

      - name: Connaître le serveur
        env:
          HOST: ${{ secrets.LAB_SSH_HOST }}
          KNOWN_HOSTS: ${{ secrets.LAB_SSH_KNOWN_HOSTS }}
        run: |
          sudo apt-get install -y --no-install-recommends sshpass
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Envoi vers le lab
        env:
          # sshpass lit le mot de passe dans l'environnement plutôt que sur la
          # ligne de commande, où il serait visible des autres processus.
          SSHPASS: ${{ secrets.LAB_SSH_PASSWORD }}
          HOST: ${{ secrets.LAB_SSH_HOST }}
          USER_SSH: ${{ secrets.LAB_SSH_USER }}
          # lab-projects/ tient les démos à l'écart du code du hub : celui-ci peut être
          # redéployé sans les emporter. Le rangement ne se voit pas dans l'URL,
          # le hub sert lab-projects/<slug>/ sur /<slug>/.
          TARGET: lab.agence-absolu.com/lab-projects/${{ steps.meta.outputs.slug }}
        run: |
          sshpass -e ssh "$USER_SSH@$HOST" "mkdir -p '$TARGET' && cd '$TARGET' && pwd"
          # --delete purge les bundles de la version précédente ; les noms étant
          # empreintés, les nouveaux fichiers sont en place avant leur retrait.
          sshpass -e rsync -az --delete dist/ "$USER_SSH@$HOST:$TARGET/"

  # --------------------------------------------------------------- prod ----
  prod:
    name: Production (bta.agence-absolu.com)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Domaine dédié servi à la racine : base "/" et non "/<slug>/".
      - run: BASE_PATH="/" npm run build

      - name: Connaître le serveur
        env:
          HOST: ${{ secrets.BTA_SSH_HOST }}
          KNOWN_HOSTS: ${{ secrets.BTA_SSH_KNOWN_HOSTS }}
        run: |
          sudo apt-get install -y --no-install-recommends sshpass
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Envoi vers la production
        env:
          SSHPASS: ${{ secrets.BTA_SSH_PASSWORD }}
          HOST: ${{ secrets.BTA_SSH_HOST }}
          USER_SSH: ${{ secrets.BTA_SSH_USER }}
          # Chemin absolu, et non relatif au home du compte SSH : si le home
          # n'est pas celui qu'on croit, un chemin relatif crée un dossier
          # ailleurs et le rsync réussit sans rien publier.
          TARGET: /home/clients/a7fe658e52dfd318a571ae01f18ae2f8/bta.agence-absolu.com/dist
        run: |
          # Trace le chemin réellement écrit : c'est ce qui manquait pour voir
          # qu'un envoi « réussi » n'atteignait pas la prod.
          sshpass -e ssh "$USER_SSH@$HOST" "mkdir -p '$TARGET' && cd '$TARGET' && pwd"
          sshpass -e rsync -az --delete dist/ "$USER_SSH@$HOST:$TARGET/"
          echo "--- contenu après envoi ---"
          sshpass -e ssh "$USER_SSH@$HOST" "ls -al '$TARGET' | head -20"
